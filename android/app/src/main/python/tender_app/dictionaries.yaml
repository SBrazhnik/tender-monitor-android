# ============================================================================
#  Словари направлений: ИТ, ИБ, АСУТП
# ----------------------------------------------------------------------------
#  Как устроено сопоставление (регистр не важен, ё = е):
#   okpd2     — префиксы кодов ОКПД2: "62" ловит 62.01.11.000 и т.п.
#   keywords  — начало слова: "программн" ловит "программное", "программных".
#   vendors   — группа/вендор: [названия и продукты]; ищутся ЦЕЛЫМ словом.
#               Сам заголовок группы (например «Печать») не ищется.
#   exclude   — если найдено, направление НЕ присваивается (защита от ложных).
#   Любой термин с префиксом "re:" — это регулярное выражение Python.
#  Правьте смело: файл перечитывается при каждом запуске.
# ============================================================================

directions:

  # ==========================================================================
  IT:
    name: "ИТ"
    okpd2:
      - "26.20"        # компьютеры, серверы, периферия, СХД
      - "26.30"        # коммуникационное оборудование (АТС, коммутаторы, радио)
      - "26.80"        # носители информации
      - "58.29"        # программное обеспечение (лицензии)
      - "62"           # разработка ПО, консультации и услуги в ИТ
      - "63.11"        # обработка данных, хостинг
      - "63.12"        # веб-порталы
      - "61"           # услуги связи и передачи данных
      - "95.11"        # ремонт компьютеров и периферии
      - "95.12"        # ремонт коммуникационного оборудования
