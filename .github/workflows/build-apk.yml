name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/TenderMonitor-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TenderMonitor-apk
          path: out/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            APK для Android 8.0+. Откройте эту страницу на телефоне и нажмите на файл .apk.
          files: out/*.apk
          make_latest: true
